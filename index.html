body{background:#f6f8fb;color:var(--ink)}

function normalize(s){return s.normalize('NFKC').toLowerCase().replace(/slow[\s‐–—_-]*fast/g,'slowfast').replace(/fast[\s‐–—_-]*slow/g,'fastslow').replace(/(?<![a-z])iii(?=度|群)/g,'3').replace(/(?<![a-z])ii(?=度|群)/g,'2').replace(/(?<![a-z])i(?=度|群)/g,'1').replace(/\s+/g,' ').trim();}

function families(items,parent,asCards){const grid=el('div',asCards?'grid':'');for(const name of new Set(items.map(c=>c.family))){const subset=items.filter(c=>c.family===name),block=el('div',asCards?'family':'');block.append(el('h3','',name));if(asCards)block.append(el('div','family-count',subset.length+'教材'));subset.forEach(c=>block.append(link(c)));grid.append(block);}parent.append(grid);}

if(!filtered.length){root.append(el('p','empty','該当する教材がありません。検索語を短くするか、検索を解除してください。'));return;}
if(mode==='tiles'&&selected===null){const grid=el('div','grid');for(const[id,title,desc]of groups){const items=filtered.filter(c=>c.tags.includes(id));if(!items.length)continue;const b=el('button','tile');b.dataset.group=id;b.append(el('strong','',title),el('small','',desc),el('span','',items.length+'教材を見る →'));b.addEventListener('click',()=>{selected=id;render();});grid.append(b);}root.append(grid);return;}
if(mode==='tiles'){const back=el('button','back','← 分類一覧へ戻る');back.id='back';back.onclick=()=>{selected=null;render();};root.append(back);}

for(const[id,title,desc]of groups){if(mode==='tiles'&&selected!==id)continue;const items=filtered.filter(c=>mode==='tiles'?c.tags.includes(id):c.group===id);if(!items.length)continue;
if(mode==='accordion'){const d=el('details','');d.dataset.group=id;d.open=terms.length>0;const s=el('summary','',title+'（'+items.length+'）');s.append(el('small','',desc));d.append(s);const body=el('div','detail-body');families(items,body,false);d.append(body);root.append(d);}else{const section=el('section','section');section.append(el('h2','',title+'（'+items.length+'）'),el('p','',desc));families(items,section,true);root.append(section);}}
}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;selected=null;render();});search.oninput=()=>{selected=null;render();};document.querySelector('#clear').onclick=()=>{search.value='';selected=null;render();};render();
})();</script></html><script>(function convenience(){
const {cards}=window.catalogData,root=document.querySelector('#content'),search=document.querySelector('#search');const prefix='ecg-catalog-v1-';let canSave=true;
function read(key,fallback){try{const value=JSON.parse(localStorage.getItem(prefix+key));return value===null?fallback:value;}catch{return fallback;}}
function save(key,value){try{localStorage.setItem(prefix+key,JSON.stringify(value));}catch{canSave=false;document.querySelector('#storage-note').textContent='このブラウザーでは保存できません。現在の画面では操作できます。';}}
const valid=id=>cards.some(c=>c.id===id);let favorites=read('favorites',[]),recent=read('recent',[]),opened=read('opened',[]);if(!Array.isArray(favorites))favorites=[];if(!Array.isArray(recent))recent=[];if(!Array.isArray(opened))opened=[];favorites=favorites.filter(valid);recent=recent.filter(valid).slice(0,5);
function node(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
function lesson(c){const a=node('a','lesson');a.href=c.href;a.dataset.id=c.id;a.append(node('strong','',c.name));return a;}
function collections(){for(const [key,ids,empty]of [['favorites',favorites,'各教材の「☆ お気に入り」を押すと、ここに表示します。'],['recent',recent,'教材を開くと、最近見た順に最大5件表示します。']]){const details=document.querySelector('#collection-'+key),body=details.querySelector('.collection-body');details.querySelector('summary').textContent=(key==='favorites'?'お気に入り':'最近見た教材')+'（'+ids.length+'）';body.replaceChildren();if(!ids.length)body.append(node('p','',empty));for(const id of ids){const c=cards.find(c=>c.id===id),row=node('div','lesson-tools');row.append(lesson(c));if(key==='favorites'){const b=node('button','favorite-toggle','解除');b.setAttribute('aria-label',c.name+'のお気に入りを解除');b.onclick=()=>toggleFavorite(id);row.append(b);}body.append(row);}}}
function toggleFavorite(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];save('favorites',favorites);collections();updateButtons();}
function updateButtons(){document.querySelectorAll('[data-favorite]').forEach(b=>{const active=favorites.includes(b.dataset.favorite);b.textContent=active?'★ 登録済み':'☆ お気に入り';b.setAttribute('aria-pressed',String(active));});}
function related(c){if(c.id==='normal-axis')return cards.filter(x=>x.id==='left-axis-deviation');if(c.id==='left-axis-deviation')return cards.filter(x=>x.id==='normal-axis');return cards.filter(x=>x.id!==c.id&&x.family===c.family&&x.group===c.group);}
function enhance(){root.querySelectorAll('a.lesson:not([data-enhanced])').forEach(a=>{a.dataset.enhanced='true';const c=cards.find(c=>c.id===a.dataset.id);if(!c)return;const block=node('div','lesson-block'),row=node('div','lesson-tools'),b=node('button','favorite-toggle');b.dataset.favorite=c.id;b.setAttribute('aria-label',c.name+'のお気に入り登録を切り替える');b.onclick=()=>toggleFavorite(c.id);a.replaceWith(block);row.append(a,b);block.append(row);const peers=related(c);if(peers.length){const details=node('details','related');details.append(node('summary','','関連教材（'+peers.length+'）'));peers.forEach(p=>{const a=lesson(p);a.dataset.enhanced='true';details.append(a);});block.append(details);}});updateButtons();if(!search.value.trim())root.querySelectorAll('details[data-group]').forEach(details=>details.open=opened.includes(details.dataset.group));}
root.addEventListener('toggle',event=>{const details=event.target;if(!details.dataset.group||search.value.trim())return;opened=[...root.querySelectorAll('details[data-group][open]')].map(d=>d.dataset.group);save('opened',opened);},true);
document.addEventListener('click',event=>{const a=event.target.closest('a.lesson[data-id]');if(!a||!valid(a.dataset.id))return;recent=[a.dataset.id,...recent.filter(id=>id!==a.dataset.id)].slice(0,5);save('recent',recent);collections();});
document.querySelector('#clear-recent').onclick=()=>{recent=[];save('recent',recent);collections();};
new MutationObserver(enhance).observe(root,{childList:true});collections();enhance();
})();</script>
